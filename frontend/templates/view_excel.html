<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Data — View</title>
    <link rel="icon" href="{{ url_for('static', filename='uploads/logo.jpeg') }}" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="view-excel-page">

    <div class="view-excel-wrapper">

        <!-- Top Bar -->
        <div class="ve-topbar">
            <div class="ve-topbar-left">
                <a href="{{ url_for('admin.export_page') }}" class="back-btn">
                    <i class="fas fa-arrow-left"></i> Export
                </a>
                <div class="ve-page-title">
                    <div class="ve-icon"><i class="fas fa-table"></i></div>
                    <div>
                        <h1>Attendance Data</h1>
                        <span>All employee records</span>
                    </div>
                </div>
            </div>

            <div class="ve-topbar-actions">
                <div class="ve-search-wrap">
                    
                    <input type="text" class="ve-search-input" id="searchInput"
                           placeholder="Filter by name…" oninput="filterTable()">
                </div>
                <a href="{{ url_for('admin.export') }}" class="ve-dl-btn">
                    <i class="fas fa-download"></i> Download Excel
                </a>
            </div>
        </div>

        <!-- Summary chips (populated by JS) -->
        <div class="ve-summary-strip" id="summaryStrip"></div>

        <!-- Table -->
        <div class="ve-table-card">
            <div class="ve-table-scroll" id="tableWrap">
                {% if table %}
                {{ table | safe }}
                {% else %}
                <div class="ve-empty-state">
                    <i class="fas fa-calendar-times"></i>
                    <p class="empty-title">No attendance records found</p>
                    <p class="empty-sub">Records will appear here once employees start logging in.</p>
                </div>
                {% endif %}
            </div>
            <div class="ve-row-count" id="rowCount"></div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const table = document.querySelector('.ve-table-scroll table');
            if (!table) return;

            const rows = table.querySelectorAll('tbody tr');
            let present = 0, absent = 0, totalRows = 0;

            rows.forEach(row => {
                totalRows++;
                const cells = row.querySelectorAll('td');
                cells.forEach(cell => {
                    const txt = cell.textContent.trim();

                    // Status badges
                    if (txt === 'Present') {
                        present++;
                        cell.innerHTML = `<span class="badge-present"><i class="fas fa-check-circle"></i> Present</span>`;
                    } else if (txt === 'Absent') {
                        absent++;
                        cell.innerHTML = `<span class="badge-absent"><i class="fas fa-times-circle"></i> Absent</span>`;
                    }

                    // Daily status 1/0
                    if (txt === '1.0' || txt === '1') {
                        cell.innerHTML = `<span class="bool-yes"><i class="fas fa-check"></i> Yes</span>`;
                    } else if (txt === '0.0' || txt === '0') {
                        cell.innerHTML = `<span class="bool-no">—</span>`;
                    }

                    // NaT / None / empty
                    if (txt === 'NaT' || txt === 'None' || txt === '') {
                        cell.innerHTML = `<span class="hours-na">—</span>`;
                    }

                    // Hours worked hh:mm:ss
                    if (/^\d{2}:\d{2}:\d{2}$/.test(txt)) {
                        const h = parseInt(txt.split(':')[0]);
                        cell.innerHTML = `<span class="${h >= 9 ? 'hours-green' : 'hours-red'}">${txt}</span>`;
                    }
                });
            });

            // Summary chips
            const strip = document.getElementById('summaryStrip');
            strip.innerHTML = `
                <div class="ve-chip">
                    <span class="chip-dot" style="background:#2563eb"></span>
                    Total Records <span class="chip-val">${totalRows}</span>
                </div>
                <div class="ve-chip">
                    <span class="chip-dot" style="background:#059669"></span>
                    Present <span class="chip-val">${present}</span>
                </div>
                <div class="ve-chip">
                    <span class="chip-dot" style="background:#dc2626"></span>
                    Absent <span class="chip-val">${absent}</span>
                </div>
            `;

            document.getElementById('rowCount').textContent =
                `Showing ${totalRows} record${totalRows !== 1 ? 's' : ''}`;
        });

        function filterTable() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.querySelectorAll('.ve-table-scroll tbody tr');
            let visible = 0;
            rows.forEach(row => {
                const name = row.cells[0]?.textContent.toLowerCase() || '';
                const show = name.includes(q);
                row.style.display = show ? '' : 'none';
                if (show) visible++;
            });
            document.getElementById('rowCount').textContent =
                `Showing ${visible} record${visible !== 1 ? 's' : ''}`;
        }
    </script>
</body>
</html>
