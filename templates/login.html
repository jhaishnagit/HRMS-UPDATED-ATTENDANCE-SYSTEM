<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Attendance System</title>
    <link rel="icon" href="../static/uploads/logo.jpeg" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="../static/css/login.css">
</head>
<body>
    <div id="splash-screen">
        <img src="{{ url_for('static', filename='uploads/logo.jpeg') }}" alt="Logo">
    </div>
    <div class="container">
        <div class="form-box">
            <img src="{{ url_for('static', filename='uploads/logo.jpeg') }}" alt="Login Image">
            <h2>Login</h2>
            <div class="flash-messages">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% for category, message in messages %}
                        <p class="{{ category }}">{{ message }}</p>
                    {% endfor %}
                {% endwith %}
            </div>
            <form method="POST" id="loginForm">
                <div class="input-group">
                    <input type="email" name="email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <input type="password" name="password" placeholder="Password" required>
                </div>
                <input type="hidden" name="login_type" id="loginType">
                <button type="submit" class="btn">Login</button>
            </form>
            <p class="redirect">
                Don't have an account? <br>
                <a href="{{ url_for('forgot_password') }}">Forgot Password?</a>
                <!--<a href="{{ url_for('register') }}">Register</a> -->
            </p>            
        </div>
    </div>
    <script src="../static/js/login.js"></script>
</body>
</html>
